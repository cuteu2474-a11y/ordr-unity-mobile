name: Unity EditMode 검증 (main 자동 + 수동)

# main 브랜치에 반영된 변경사항을 자동 검증하고 수동 실행도 허용한다.
# 진행 중인 작업은 자동 취소하지 않는다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ordr-unity-editmode
  cancel-in-progress: false

jobs:
  check:
    name: 원본맵 자료 검증 및 Unity EditMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 원본 맵 자료의 비 Unity 회귀 테스트
        run: python3 -m unittest discover -s tests -q

      - name: Unity 라이선스 설정 확인
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo 'Unity 실행을 위해 저장소 Secrets에 UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD가 필요합니다.'
            exit 1
          fi

      - name: Unity 6 EditMode 테스트
        id: tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Unity 테스트 결과 파일 첨부
        if: ${{ always() && steps.tests.outputs.artifactsPath != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore

  android-apk-preview:
    name: Android 개발용 APK 제작
    # APK는 명시적으로 요청된 커밋에서만 만든다. 이후 매 push마다 빌드하지 않는다.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-preview]') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Android 빌드용 디스크 여유 확보
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Unity Android APK 생성
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          buildName: ORDR-Mobile-Development

      - name: 개발용 APK 첨부
        uses: actions/upload-artifact@v4
        with:
          name: ordr-mobile-android-development-apk
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
